apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: msstore
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api }
    spec:
      # wait until SQL Server accepts connections, EnsureCreated runs at startup
      initContainers:
        - name: wait-for-sql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mssql 1433; do echo waiting for mssql; sleep 2; done"]
      containers:
        - name: orders-api
          image: msstore/orders-api:1.0
          imagePullPolicy: Never      # built by "docker compose build", Docker Desktop k8s sees the same images
          ports:
            - containerPort: 8080     # every API listens on 8080 in ITS OWN pod, no conflict
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development      # keeps Swagger on (Program.cs only maps it in Development)
            - name: ConnectionStrings__DefaultConnection   # overrides appsettings*.json
              valueFrom:
                secretKeyRef: { name: msstore-db, key: orders-api }
            - name: StockApiUrl         # was http://localhost:5040/
              value: http://stocks-api:8080/
---
# stable DNS name "orders-api" for the other pods: http://orders-api:8080/
# NodePort 30126 = reachable from your machine at http://<minikube ip>:30126/
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: msstore
spec:
  type: NodePort
  selector: { app: orders-api }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30126
