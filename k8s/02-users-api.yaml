apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: msstore
spec:
  replicas: 1                 # can scale: kubectl -n msstore scale deployment/users-api --replicas=3
  selector:
    matchLabels: { app: users-api }
  template:
    metadata:
      labels: { app: users-api }
    spec:
      containers:
        - name: users-api
          image: msstore/users-api:1.0
          imagePullPolicy: Never      # built by "docker compose build", Docker Desktop k8s sees the same images
          ports:
            - containerPort: 8080     # every API listens on 8080 in ITS OWN pod, no conflict
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development      # keeps Swagger on (Program.cs only maps it in Development)
            - name: ConnectionStrings__DefaultConnection   # overrides appsettings*.json
              valueFrom:
                secretKeyRef: { name: msstore-db, key: users-api }

---
# stable DNS name "users-api" for the other pods: http://users-api:8080/
# NodePort 30221 = reachable from your machine at http://<minikube ip>:30221/
apiVersion: v1
kind: Service
metadata:
  name: users-api
  namespace: msstore
spec:
  type: NodePort
  selector: { app: users-api }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30221
