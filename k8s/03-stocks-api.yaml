apiVersion: apps/v1
kind: Deployment
metadata:
  name: stocks-api
  namespace: msstore
spec:
  replicas: 1
  selector:
    matchLabels: { app: stocks-api }
  template:
    metadata:
      labels: { app: stocks-api }
    spec:
      containers:
        - name: stocks-api
          image: msstore/stocks-api:1.0
          imagePullPolicy: Never      # built by "docker compose build", Docker Desktop k8s sees the same images
          ports:
            - containerPort: 8080     # every API listens on 8080 in ITS OWN pod, no conflict
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development      # keeps Swagger on (Program.cs only maps it in Development)
            - name: ConnectionStrings__DefaultConnection   # overrides appsettings*.json
              valueFrom:
                secretKeyRef: { name: msstore-db, key: stocks-api }
            - name: UsersApiUrl          # was http://localhost:5221/
              value: http://users-api:8080/
---
# stable DNS name "stocks-api" for the other pods: http://stocks-api:8080/
# NodePort 30040 = reachable from your machine at http://<minikube ip>:30040/
apiVersion: v1
kind: Service
metadata:
  name: stocks-api
  namespace: msstore
spec:
  type: NodePort
  selector: { app: stocks-api }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30040
