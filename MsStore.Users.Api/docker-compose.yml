# Self-hosted Users API: runs on its own, with its own SQL Server instance.
services:
  users-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Pass"
    ports:
      - "1434:1433"
    volumes:
      - users-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  users-api:
    build:
      context: ..
      dockerfile: MsStore.Users.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=users-db,1433;Database=MsStoreUsers;User Id=sa;Password=YourStrong!Pass;TrustServerCertificate=True"
    ports:
      - "5154:8080"
    depends_on:
      users-db:
        condition: service_healthy

volumes:
  users-db-data:
